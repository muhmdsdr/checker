
<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>بررسی آیدی اینستاگرام</title>
    <style>
        body { font-family: sans-serif; padding: 20px; direction: rtl; background: #f7f7f7; }
        button { padding: 10px 20px; font-size: 16px; }
        #results { margin-top: 20px; white-space: pre-line; background: #fff; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>🔍 بررسی آیدی‌های اینستاگرام</h2>
    <button onclick="checkUsernames()">بررسی کن</button>
    <div id="results"></div>

    <script>
        const usernames = [
            "sadrllq", "sdrvvnv", "sadrqwe", "sdrxyz", "sdrasdf", "sadr1234"
        ];

        const delay = (ms) => new Promise((res) => setTimeout(res, ms));

        async function checkUsernames() {
            const resultsBox = document.getElementById("results");
            resultsBox.innerText = "در حال بررسی...
";
            for (const username of usernames) {
                const url = `https://www.instagram.com/${username}/`;
                try {
                    const response = await fetch(url, { method: "GET" });
                    if (response.status === 404) {
                        resultsBox.innerText += `✅ آزاد: ${username}\n`;
                    } else {
                        resultsBox.innerText += `❌ گرفته شده: ${username}\n`;
                    }
                } catch (err) {
                    resultsBox.innerText += `⚠️ خطا در بررسی ${username}\n`;
                }
                await delay(1500);
            }
        }
    </script>
</body>
</html>
